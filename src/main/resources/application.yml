spring:
  datasource:
    url: jdbc:h2:mem:jpalab;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=1500
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.jpalab.support.SqlCaptureInspector
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      cache:
        cachecontrol:
          # 학습 페이지가 갱신될 때 브라우저가 옛 JS/CSS를 계속 쓰지 않도록 매번 재검증
          no-cache: true
          must-revalidate: true

server:
  port: 8080

logging:
  level:
    org.hibernate.orm.jdbc.bind: warn
