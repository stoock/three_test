spring:
  datasource:
    url: jdbc:h2:mem:jpalab;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=1500
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        session_factory:
          statement_inspector: com.jpalab.support.SqlCaptureInspector
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    org.hibernate.orm.jdbc.bind: warn
